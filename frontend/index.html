<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animo</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav id="main-nav"></nav>

    <div class="hero">
        <div class="hero-bg"></div>

        <div class="hero-frame">
            <div class="hero-frame-num">01</div>
            <div class="hero-frame-label">Frame</div>
        </div>

        <div class="hero-content">
            <div class="hero-eyebrow">Your Anime Collection</div>
            <h1>ANIMO</h1>

            <div class="hero-ctas">
                <a href="/movies.html" class="btn btn-primary">Browse อนิเมะ</a>
                <a href="/dvds.html" class="btn btn-secondary">SHOP</a>
            </div>
        </div>
    </div>

    <div class="hero-stats">
        <div class="hero-stat">
            <div class="hero-stat-num" id="stat-movies">—</div>
            <div class="hero-stat-label">อนิเมะ</div>
        </div>
        <div class="hero-stat">
            <div class="hero-stat-num" id="stat-directors">—</div>
            <div class="hero-stat-label">Directors</div>
        </div>
        <div class="hero-stat">
            <div class="hero-stat-num" id="stat-dvds">—</div>
            <div class="hero-stat-label">หนังสือ Available</div>
        </div>
        <div class="hero-stat">
            <div class="hero-stat-num">10%</div>
            <div class="hero-stat-label">Discount on 3+</div>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <div>
                <div class="page-sub">A glimpse of our collection</div>
                <h2 class="page-title">Featured</h2>
            </div>
            <a href="/movies.html" class="btn btn-ghost btn-sm">View all</a>
        </div>
        <div class="card-grid" id="featured">
            <div class="loading">Loading</div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        async function loadStats() {
            var [movRes, dirRes, dvdRes] = await Promise.all([
                apiFetch('/movies/?page=1'),
                apiFetch('/directors/?page=1'),
                apiFetch('/dvds/?page=1'),
            ]);
            if (movRes && movRes.ok) {
                var d = await movRes.json();
                document.getElementById('stat-movies').textContent = d.count || '—';
            }
            if (dirRes && dirRes.ok) {
                var d = await dirRes.json();
                document.getElementById('stat-directors').textContent = d.count || '—';
            }
            if (dvdRes && dvdRes.ok) {
                var d = await dvdRes.json();
                document.getElementById('stat-dvds').textContent = d.count || '—';
            }
        }

        async function loadFeatured() {
            var res = await apiFetch('/movies/?page=1&page_size=4');
            if (!res) return;
            var data = await res.json();
            var movies = data.results || [];
            var grid = document.getElementById('featured');
            if (!movies.length) {
                grid.innerHTML = '<div class="empty-state"><p>No movies yet.</p></div>';
                return;
            }
            grid.innerHTML = movies.map(function(m, i) {
                var idx = String(i + 1).padStart(2, '0');
                var year = m.release_date ? m.release_date.slice(0, 4) : '';
                var meta = [m.director_name || 'Unknown', year].filter(Boolean).join(' \u2022 ');
                return '<a class="card" href="/movie-detail.html?id=' + m.id + '">' +
                    '<span class="card-frame">' + idx + '</span>' +
                    (m.poster_url
                        ? '<img src="' + m.poster_url + '" alt="' + m.title + '" loading="lazy">'
                        : '<div class="card-img-placeholder">NO FILM</div>') +
                    '<div class="card-body">' +
                    '<div class="card-title">' + m.title + '</div>' +
                    '<div class="card-meta">' + meta + '</div>' +
                    '</div></a>';
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadFeatured();
            loadStats();
        });
    </script>
</body>
</html>
